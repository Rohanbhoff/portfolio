  <path d="M10 28 C3 28, 3 34, 10 34" stroke="#ff4d6d" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M12 37 C6 40, 5 45, 12 43" stroke="#ff4d6d" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Petal Gills -->
  <path d="M52 20 C58 18, 60 23, 54 26" stroke="#ff4d6d" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 28 C61 28, 61 34, 54 34" stroke="#ff4d6d" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M52 37 C58 40, 59 45, 52 43" stroke="#ff4d6d" stroke-width="3" stroke-linecap="round"/>

  <!-- Chubby Soft Pink Head -->
  <rect x="11" y="16" width="42" height="34" rx="17" fill="url(#axolotlGradient)" stroke="#ff758f" stroke-width="1.5"/>

  <!-- Rosy Blush Cheeks -->
  <ellipse cx="18" cy="36" rx="4.5" ry="2.8" fill="#ff1e56" opacity="0.6"/>
  <ellipse cx="46" cy="36" rx="4.5" ry="2.8" fill="#ff1e56" opacity="0.6"/>

  <!-- Big Shiny Dark Eyes -->
  <circle cx="21" cy="29" r="4.5" fill="#180812"/>
  <circle cx="22.5" cy="27.5" r="1.6" fill="#ffffff"/>
  <circle cx="20" cy="31" r="0.8" fill="#ffffff" opacity="0.8"/>

  <circle cx="43" cy="29" r="4.5" fill="#180812"/>
  <circle cx="44.5" cy="27.5" r="1.6" fill="#ffffff"/>
  <circle cx="42" cy="31" r="0.8" fill="#ffffff" opacity="0.8"/>

  <!-- Cute Cat Smile (Lying-down 3) -->
  <path d="M28 36 C29.5 39, 31 38.5, 32 36.5 C33 38.5, 34.5 39, 36 36" stroke="#641b30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
