<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- KIIT University Official Emblem Mark -->
  <g id="kiit-emblem">
    <rect x="6" y="8" width="54" height="54" rx="14" fill="url(#kiitGrad)" />
    <!-- Academic torch & gear motif -->
    <path d="M33 16 L38 27 H28 Z" fill="#ffd166" />
    <path d="M31 27 H35 V44 H31 Z" fill="#ffffff" />
    <circle cx="33" cy="46" r="4" fill="#ffd166" />
    <!-- Laurel leaf accents -->
    <path d="M19 28 C16 35, 20 44, 28 47" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M47 28 C50 35, 46 44, 38 47" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
  <g id="kiit-text" font-family="'Outfit', 'Space Grotesk', sans-serif">
    <text x="70" y="34" font-size="22" font-weight="900" fill="#10b981" letter-spacing="1">KIIT</text>
    <text x="122" y="34" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.5">UNIVERSITY</text>
    <text x="70" y="50" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="0.4">Bhubaneswar, Odisha</text>
  </g>
  <defs>
    <linearGradient id="kiitGrad" x1="6" y1="8" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" />
      <stop offset="1" stop-color="#064e3b" />
    </linearGradient>
  </defs>
</svg>
